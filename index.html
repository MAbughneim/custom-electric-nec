<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Electric NEC Assistant</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f3f4f6;
            margin:0;
            padding:0;
            text-align:center;
        }

        header{
            background:#005a9c;
            color:white;
            padding:20px;
        }

        .container{
            max-width:800px;
            margin:50px auto;
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        h1{
            margin-top:0;
        }

        .button{
            display:inline-block;
            background:#0078d4;
            color:white;
            padding:15px 30px;
            text-decoration:none;
            border-radius:8px;
            margin-top:20px;
        }

        .button:hover{
            background:#005a9c;
        }
    </style>
</head>
<body>

<header>
    <h1>Custom Electric NEC Assistant</h1>
</header>

<div class="container">

    <h2>Welcome</h2>

    <p>
        NEC Code Search, Calculations, and Electrical Reference Assistant.
    </p>

    <p>
        Built for Custom Electric Project Managers, Engineers,
        Estimators, and Field Personnel.
    </p>

    <a class="button" href="#">
        Open NEC Assistant
    </a>

</div>

</body>
</html>
